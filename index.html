<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Todo Life Dashboard - A simple tool to organize your day with greeting, focus timer, tasks, and quick links">
  <title>Todo Life Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <div id="settings-container">
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" aria-pressed="false">
        <span class="theme-icon" aria-hidden="true">🌙</span>
      </button>
    </div>
  </header>

  <main id="main-content">
    <!-- Greeting Section -->
    <section id="greeting-section" aria-labelledby="greeting-heading">
      <h1 id="greeting-heading" class="visually-hidden">Greeting</h1>
      <div id="time-display" role="timer" aria-live="polite" aria-atomic="true">00:00</div>
      <div id="date-display">Loading...</div>
      <div id="greeting-container" aria-live="polite">
        <span id="greeting-text">Hello,</span>
        <span id="user-name">User</span>
        <button id="edit-name-btn" aria-label="Edit your name">Edit</button>
        <input type="text" id="name-input" class="hidden" aria-label="Enter your name" maxlength="50">
      </div>
    </section>

    <!-- Focus Timer Section -->
    <section id="timer-section" aria-labelledby="timer-heading">
      <h2 id="timer-heading">Focus Timer</h2>
      <div id="timer-display" role="timer" aria-live="polite" aria-atomic="true">25:00</div>
      <div id="timer-controls">
        <button id="start-btn" aria-label="Start timer">Start</button>
        <button id="stop-btn" aria-label="Stop timer">Stop</button>
        <button id="reset-btn" aria-label="Reset timer">Reset</button>
      </div>
      <div id="timer-announcement" class="visually-hidden" aria-live="assertive"></div>
    </section>

    <!-- Task List Section -->
    <section id="task-section" aria-labelledby="task-heading">
      <h2 id="task-heading">Tasks</h2>
      <div id="task-input-area">
        <input type="text" id="task-input" placeholder="Add a task..." aria-label="Task description" maxlength="200">
        <input type="date" id="task-deadline" aria-label="Task deadline (optional)">
        <select id="task-priority" aria-label="Task priority (optional)">
          <option value="">No priority</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <button id="add-task-btn" aria-label="Add task">Add</button>
      </div>
      <hr class="task-separator">
      <div id="task-sort">
        <label for="sort-select">Sort by:</label>
        <select id="sort-select">
          <option value="creation">Creation Order</option>
          <option value="alphabetical">Alphabetical</option>
          <option value="priority">Priority</option>
          <option value="completion">Completion Status</option>
        </select>
      </div>
      <hr class="task-separator">
      <ul id="task-list" role="list" aria-label="Task list">
        <!-- Task items rendered here -->
      </ul>
      <div id="task-announcement" class="visually-hidden" aria-live="polite"></div>
    </section>

    <!-- Quick Links Section -->
    <section id="links-section" aria-labelledby="links-heading">
      <h2 id="links-heading">Quick Links</h2>
      <div id="link-form">
        <input type="text" id="link-name" placeholder="Link name" aria-label="Link name" maxlength="50">
        <input type="url" id="link-url" placeholder="https://..." aria-label="Link URL" maxlength="500">
        <button id="add-link-btn" aria-label="Add link">Add Link</button>
      </div>
      <div id="links-container" class="links-grid" role="navigation" aria-label="Quick links">
        <!-- Link buttons rendered here -->
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>

</html>
