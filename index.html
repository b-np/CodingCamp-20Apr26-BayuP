<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Todo Life Dashboard - A simple tool to organize your day with greeting, focus timer, tasks, and quick links">
  <title>Todo Life Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <div id="settings-container">
      <button id="theme-toggle" class="icon-button" aria-label="Toggle dark mode" aria-pressed="false">
        <span class="theme-icon" aria-hidden="true">🌙</span>
      </button>
    </div>
  </header>

  <main id="main-content">
    <!-- Greeting Section -->
    <section id="greeting-section" aria-labelledby="greeting-heading">
      <h1 id="greeting-heading" class="visually-hidden">Greeting</h1>
      <div id="time-display" role="timer" aria-live="polite" aria-atomic="true">00:00</div>
      <div id="date-display">Loading...</div>
      <div id="greeting-container" aria-live="polite">
        <span id="greeting-text">Hello,</span>
        <span id="greeting-name">User</span>
        <button id="edit-name-button" class="generic-button" aria-label="Edit your name">Edit</button>
        <div id="greeting-edit-container" class="hidden">
          <input type="text" id="greeting-edit-name-input" aria-label="Enter your name" maxlength="50">
          <button id="greeting-edit-save-button" class="generic-button">Save</button>
          <button id="greeting-edit-cancel-button" class="generic-button">Cancel</button>
        </div>
      </div>
    </section>

    <!-- Focus Timer Section -->
    <section id="timer-section" aria-labelledby="timer-heading">
      <h2 id="timer-heading">Focus Timer</h2>
      <div id="timer-announcement" class="visually-hidden" aria-live="assertive"></div>
      <div id="timer-display-container">
        <div id="timer-display" role="timer" aria-live="polite" aria-atomic="true">25:00</div>
        <div id="timer-display-edit" class="hidden">
          <input type="number" id="timer-minutes-input" min="1" max="99" value="25" aria-label="Minutes">
          <span>:</span>
          <input type="number" id="timer-seconds-input" min="0" max="59" value="00" aria-label="Seconds">
        </div>
      </div>
      <div id="timer-edit-controls">
        <button id="timer-edit-button" class="generic-button" aria-label="Edit timer duration">Change Time</button>
        <button id="timer-save-button" class="hidden generic-button" aria-label="Save timer duration">Save</button>
        <button id="timer-cancel-button" class="hidden generic-button" aria-label="Cancel timer edit">Cancel</button>
      </div>
      <div id="timer-controls">
        <button id="timer-start-button" aria-label="Start timer">Start</button>
        <button id="timer-stop-button" aria-label="Stop timer">Stop</button>
        <button id="timer-reset-button" aria-label="Reset timer">Reset</button>
      </div>
    </section>

    <!-- Task List Section -->
    <section id="task-section" aria-labelledby="task-heading">
      <h2 id="task-heading">Tasks</h2>
      <div id="task-announcement" class="visually-hidden" aria-live="polite"></div>
      <div id="task-input-area">
        <label for="task-input">Description: </label>
        <input type="text" id="task-input" placeholder="Add a task..." aria-label="Task description" maxlength="200">
        <label for="task-priority">Priority: </label>
        <select id="task-priority" aria-label="Task priority (optional)">
          <option value="">None</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <button id="add-task-button" aria-label="Add task">+</button>
      </div>
      <hr class="line-separator">
      <div id="task-sort">
        <label for="sort-select">Sort by:</label>
        <select id="sort-select">
          <option value="default">Default</option>
          <option value="alphabetical">Alphabetical</option>
          <option value="priority">Priority</option>
        </select>
      </div>
      <ul id="task-list" role="list" aria-label="Task list">
        <!-- Task items rendered here. Handled in JavaScript. -->
      </ul>
    </section>

    <!-- Quick Links Section -->
    <section id="quick-links-section" aria-labelledby="quick-links-heading">
      <h2 id="quick-links-heading">Quick Links</h2>
      <div id="quick-link-form">
        <label for="quick-link-label">Label</label>
        <input type="text" id="quick-link-label" placeholder="e.g., Google" aria-label="Link label" maxlength="50">
        <label for="quick-link-url">URL</label>
        <input type="url" id="quick-link-url" placeholder="e.g., https://google.com, google.com" aria-label="Link URL" maxlength="500">
        <button id="add-quick-link-button" aria-label="Add link">+</button>
      </div>
      <hr class="line-separator">
      <div id="quick-links-container" class="quick-links-grid" role="navigation" aria-label="Quick links">
        <!-- Link buttons rendered here -->
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>

</html>
